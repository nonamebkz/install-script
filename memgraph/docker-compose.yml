version: "3.9"

services:
  memgraph:
    image: memgraph/memgraph:latest
    container_name: memgraph
    restart: unless-stopped
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"
      - "${MEMGRAPH_HTTP_PORT:-7444}:7444"
      - "${MEMGRAPH_PORT:-3001}:3000"
    volumes:
      - ${MEMGRAPH_DATA_DIR:-./data/memgraph}:/var/lib/memgraph
      - ${MEMGRAPH_LOG_DIR:-./data/log}:/var/log/memgraph
      - ${MEMGRAPH_ETC_DIR:-./data/etc}:/etc/memgraph
    command: [
      "--log-level=${MEMGRAPH_LOG_LEVEL:-TRACE}"
    ]

  memgraph-lab:
    image: memgraph/lab:latest
    container_name: memgraph-lab
    restart: unless-stopped
    ports:
      - "${MEMGRAPH_LAB_PORT:-3002}:3000"
    depends_on:
      - memgraph
