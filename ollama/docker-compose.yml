services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0:11434}
    volumes:
      - ${OLLAMA_DATA_DIR:-./data/ollama}:/root/.ollama
    restart: always

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    depends_on:
      - ollama
    ports:
      - "${OPENWEBUI_PORT:-3030}:8080"
    environment:
      - ENABLE_OLLAMA_API=${ENABLE_OLLAMA_API:-true}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-your_secret_key_here}
      - USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS=${USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS:-true}
    volumes:
      - ${OPENWEBUI_DATA_DIR:-./data/openwebui}:/app/backend/data
    restart: always
