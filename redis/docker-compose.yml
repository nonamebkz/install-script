version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-./data}:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_strong_password} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_strong_password}
